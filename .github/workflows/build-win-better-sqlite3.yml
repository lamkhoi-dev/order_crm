name: Build better-sqlite3 (Windows x64)

on:
  workflow_dispatch:
    inputs:
      node-version:
        description: 'Node major version to build against (must match the POS machine)'
        required: false
        default: '22'

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install server deps (compiles better-sqlite3 via node-gyp)
        working-directory: server
        run: npm install

      - name: Verify the addon loads
        working-directory: server
        run: node -e "new (require('better-sqlite3'))(':memory:'); console.log('better-sqlite3 OK on', process.version)"

      - name: Rename artifact with node/platform tag
        shell: bash
        run: |
          mkdir -p artifact
          cp server/node_modules/better-sqlite3/build/Release/better_sqlite3.node \
             "artifact/better_sqlite3-win32-x64-node${{ inputs.node-version }}.node"

      - uses: actions/upload-artifact@v4
        with:
          name: better-sqlite3-win32-x64-node${{ inputs.node-version }}
          path: artifact/*.node
